<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Text Box</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Text Box Save Example</h1>
        <textarea id="textInput" rows="4" cols="50" placeholder="Enter your text here..."></textarea><br><br>
        <button id="saveButton">Save</button>

        <h2>Saved Text:</h2>
        <div id="savedText" class="saved-text">No text saved yet.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
